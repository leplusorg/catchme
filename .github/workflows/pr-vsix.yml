---
######################################################
## Build an installable .vsix for every pull request ##
######################################################
# Lets reviewers install the actual build instead of taking the diff's word
# for it: download the artifact, then `code --install-extension catchme.vsix`.
name: PR Package

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsix:
    name: Package extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Note: the .vsix will not contain the jdt.ls analyzer jar unless
      # `pnpm run build:server && pnpm run copy:server` has run. That is
      # intentional here — this artifact is for reviewing the extension itself.
      - name: Package
        run: pnpm --filter catchme run package

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catchme-vsix
          path: catchme.vsix
          if-no-files-found: error
