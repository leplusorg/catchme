---
######################################################
## Build an installable .vsix for every pull request ##
######################################################
# Lets reviewers install the actual build instead of taking the diff's word
# for it: download the artifact, then `code --install-extension catchme.vsix`.
name: PR Package

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsix:
    name: Package extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Note: the .vsix will not contain the jdt.ls analyzer jar unless
      # `pnpm run build:server && pnpm run copy:server` has run. That is
      # intentional here — this artifact is for reviewing the extension itself.
      - name: Package
        run: pnpm --filter catchme run package

      - name: Upload .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catchme-vsix
          path: catchme.vsix
          if-no-files-found: error
