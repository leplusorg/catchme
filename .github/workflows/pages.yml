---
##################################################################
## Build the homepage and publish it to GitHub Pages            ##
##################################################################
# Deployed from an Actions artifact rather than a gh-pages branch: the built
# site is generated output, and this repository does not commit generated
# output anywhere else either. It also keeps every action under `actions/*`,
# which is already allowlisted in .zizmor.yml.
#
# Published as a project page at https://leplusorg.github.io/catchme/, so the
# site is built with a /catchme/ path prefix; the build check enforces it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # The homepage shows the latest release, resolved at build time. Rebuilding on
  # publish is what keeps that current without anyone editing the site.
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# Never let two deploys race; cancel a superseded build but let an in-flight
# deployment finish, or Pages can be left pointing at a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Lifts the anonymous GitHub API rate limit for the release lookup;
          # shared runners can otherwise exhaust 60/hour. Read-only, and the
          # build degrades gracefully without it.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @leplusorg/catchme-site run build

      # Fails the deploy if the site ever grows a script tag, a CDN font, or an
      # unprefixed asset path - all of which are silent breakages otherwise,
      # looking fine locally and 404ing only once published under /catchme/.
      - name: Check the built site
        run: pnpm --filter @leplusorg/catchme-site run test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # publish the deployment
      id-token: write # OIDC token the deploy action verifies with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
